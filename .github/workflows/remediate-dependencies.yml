name: Remediate dependency advisories

on:
  push:
    branches: [weather-world-redesign]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: weather-world-redesign
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix
      - name: Lint source
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Confirm no high/critical advisories remain
        run: npm audit --audit-level=high
      - name: Commit updated lockfile after successful checks
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: update vulnerable npm dependencies"
            git push origin HEAD:weather-world-redesign
          else
            echo "No lockfile changes needed."
          fi
